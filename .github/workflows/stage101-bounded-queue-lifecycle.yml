name: Stage101 bounded MPSC queue and teardown lifecycle audit

on:
  push:
    branches:
      - work/stage91-tx-submission-callback-v1
    paths:
      - 'driver/RTL88WiFi/src/compat/linux/mpsc_bounded_queue.h'
      - 'driver/RTL88WiFi/src/compat/linux/mpsc_retire_stack.h'
      - 'driver/RTL88WiFi/src/compat/linux/skbuff.h'
      - 'driver/RTL88WiFi/src/compat/rtw88_compat.c'
      - 'driver/RTL88WiFi/src/compat/rtw88_compat.h'
      - 'driver/RTL88WiFi/src/kext/RTW88PCIDevice.cpp'
      - 'driver/RTL88WiFi/src/kext/RTW88PCIDevice.hpp'
      - 'driver/RTL88WiFi/src/kext/wcl24h32/RTW88WCLPCIBackend.cpp'
      - 'driver/RTL88WiFi/src/kext/wcl24h32/RTW88WCLPCIBackend.hpp'
      - 'driver/RTL88WiFi/src/kext/wcl24h32/RTW88WCLController.cpp'
      - 'tests/test-wcl-stage100-tx-callback-deferral.py'
      - 'tests/wcl_skb_free_retire_stack_test.cpp'
      - 'tools/run-stage101-bounded-queue-lifecycle.sh'
      - '.github/workflows/stage101-bounded-queue-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-queue-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/stage91-tx-submission-callback-v1
      - name: Run lifecycle audit and MPSC stress
        run: |
          set -o pipefail
          bash tools/run-stage101-bounded-queue-lifecycle.sh | tee stage101-result.txt
      - name: Upload Stage101 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage101-bounded-queue-lifecycle
          path: stage101-result.txt
